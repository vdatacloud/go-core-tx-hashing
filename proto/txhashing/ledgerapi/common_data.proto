// Regenerate with `go generate ./...` (see gen.go).

syntax = "proto3";

package txhashing.ledgerapi;

option go_package = "github.com/vdatacloud/go-core-tx-hashing/ledgerapi";

import "txhashing/ledgerapi/value.proto";


message GlobalKey {
  // The identifier uses the package-id reference format.
  //
  // Required
  Identifier template_id = 1;
  // Required
  string package_name = 2;
  // Required
  Value key = 3;
  // Required: must be non-empty
  bytes hash = 4;
}

message GlobalKeyWithMaintainers {
  // The key
  //
  // Required
  GlobalKey key = 1;
  // Key maintainers
  //
  // Required: must be non-empty
  repeated string maintainers = 2;
}
