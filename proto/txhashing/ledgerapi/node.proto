// trimmed to what a prepared transaction holds. Message and field numbers are
// unchanged, so the wire format is Canton's; only the proto package differs,
// so these types never clash with other Ledger API bindings in one program.
// Regenerate with `go generate ./...` (see gen.go).

syntax = "proto3";

package txhashing.ledgerapi;

option go_package = "github.com/vdatacloud/go-core-tx-hashing/ledgerapi";

import "txhashing/ledgerapi/common_data.proto";
import "txhashing/ledgerapi/value.proto";



/*
 * Transaction Nodes
 */

// Fetch node
message Fetch {
  // Specific LF serialization version of the node
  //
  // Required
  string lf_version = 1;
  // Required
  string contract_id = 2;
  // Required
  string package_name = 3;
  // The identifier uses the package-id reference format.
  //
  // Required
  Identifier template_id = 4;
  // Required: must be non-empty
  repeated string signatories = 5;
  // Required: must be non-empty
  repeated string stakeholders = 6;
  // Required: must be non-empty
  repeated string acting_parties = 7;
  // Optional
  Identifier interface_id = 8;
  // Can only be populated from lf_version >= 2
  //
  // Optional
  optional GlobalKeyWithMaintainers key = 9;
  // Can only be true from lf_version >= 2
  //
  // Required
  bool by_key = 10;
}

// Exercise node
message Exercise {
  // Specific LF serialization version of the node
  //
  // Required
  string lf_version = 1;
  // Required
  string contract_id = 2;
  // Required
  string package_name = 3;
  // The identifier uses the package-id reference format.
  //
  // Required
  Identifier template_id = 4;
  // Required: must be non-empty
  repeated string signatories = 5;
  // Required: must be non-empty
  repeated string stakeholders = 6;
  // Required: must be non-empty
  repeated string acting_parties = 7;
  // The identifier uses the package-id reference format.
  //
  // Optional
  Identifier interface_id = 8;
  // Required
  string choice_id = 9;
  // Required
  Value chosen_value = 10;
  // Required
  bool consuming = 11;
  // Optional: can be empty
  repeated string children = 12;
  // Optional
  Value exercise_result = 13;
  // Optional: can be empty
  repeated string choice_observers = 14;
  // Can only be populated from lf_version >= 2
  //
  // Optional
  optional GlobalKeyWithMaintainers key = 15;
  // Can only be true from lf_version >= 2
  //
  // Required
  bool by_key = 16;
  // Can only be populated from lf_version dev.
  //
  // Field 17, external_call_results (LF dev only, hashed from scheme V4), is
  // left out on purpose: V2 and V3 don't hash it, so a transaction carrying it
  // is refused as UNKNOWN_FIELD, as @canton-network/core-tx-hashing refuses it.
  reserved 17;
}

// Create Node
message Create {
  // Specific LF serialization version of the node
  //
  // Required
  string lf_version = 1;
  // Required
  string contract_id = 2;
  // Required
  string package_name = 3;
  // The identifier uses the package-id reference format.
  //
  // Required
  Identifier template_id = 4;
  // Required
  Value argument = 5;
  // Required: must be non-empty
  repeated string signatories = 6;
  // Required: must be non-empty
  repeated string stakeholders = 7;
  // Only populated from lf_version >= 2
  //
  // Optional
  optional GlobalKeyWithMaintainers key = 8;
}

// Rollback Node
message Rollback {
  // Required: must be non-empty
  repeated string children = 1;
}

message QueryByKey {
  // Specific LF serialization version of the node
  //
  // Required
  string lf_version = 1;
  // Required
  string package_name = 2;
  // The identifier uses the package-id reference format.
  //
  // Required
  Identifier template_id = 3;
  // Required
  bool exhaustive = 4;
  // key to query for
  //
  // Required
  GlobalKeyWithMaintainers key = 5;
  // Result of the query: list of contract Ids matching the query
  //
  // Optional: can be empty
  repeated string result = 6;
}

message Node {
  // Required
  oneof node_type {
    Create create = 1;
    Fetch fetch = 2;
    Exercise exercise = 3;
    Rollback rollback = 4;
    // Only from PV 35
    QueryByKey query_by_key = 5;
  }
}
